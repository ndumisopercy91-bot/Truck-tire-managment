<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141c">
<meta name="description" content="Tire tracking and fleet visualisation for the Menzele Trading Volvo FMX horse and 2-unit side-tipper link combination — 26 tire positions, replacement history and service alerts.">
<title>Menzele Trading — Tire Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e141c'/><circle cx='16' cy='16' r='9' fill='none' stroke='%2322c55e' stroke-width='3'/><circle cx='16' cy='16' r='3' fill='%2394a3b8'/></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-view="rig">

<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>Menzele Trading</strong>
        <small id="rig-title">Volvo FMX + 2 side-tippers</small>
      </span>
    </div>
    <span id="alert-pill" class="pill pill-green">All 26 in service</span>
  </div>

  <div class="topbar-right">
    <label class="odo">
      <span>Odometer</span>
      <input id="odo-input" type="number" min="0" step="100" inputmode="numeric" aria-label="Current rig odometer in kilometres">
      <em>km</em>
    </label>
    <button id="quick-log" class="btn btn-primary">＋ Log replacement</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab is-active" data-view="rig" role="tab" aria-selected="true">Rig</button>
  <button class="tab" data-view="dashboard" role="tab" aria-selected="false">Dashboard</button>
  <button class="tab" data-view="log" role="tab" aria-selected="false">Log</button>
  <button class="tab" data-view="settings" role="tab" aria-selected="false">Settings</button>
</nav>

<main>
  <!-- ------------------------------------------------------------- rig -->
  <section id="view-rig" class="view view-rig">
    <div class="stage-col">
      <div class="stage-toolbar">
        <div class="seg" role="group" aria-label="View style">
          <button class="seg-btn is-active" data-mode="top">Top-down</button>
          <button class="seg-btn" data-mode="iso">3/4 view</button>
        </div>
        <div class="seg" role="group" aria-label="Zoom to unit">
          <button class="seg-btn is-active" data-focus="fit">Whole rig</button>
          <button class="seg-btn" data-focus="horse">Horse</button>
          <button class="seg-btn" data-focus="t1">Trailer 1</button>
          <button class="seg-btn" data-focus="t2">Trailer 2</button>
        </div>
        <div class="seg seg-zoom" role="group" aria-label="Zoom">
          <button class="seg-btn" id="zoom-out" aria-label="Zoom out">−</button>
          <button class="seg-btn" id="zoom-reset" aria-label="Reset zoom">Reset</button>
          <button class="seg-btn" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div id="legend" class="legend" aria-label="Status legend"></div>
      </div>

      <div id="stage" class="stage">
        <svg id="rig-svg" role="img" aria-label="Interactive rig diagram with 26 tire positions"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="stage-hint">Tap a tire or its number to open the record · drag to pan · scroll to zoom</p>
      </div>
    </div>

    <aside id="side-panel" class="side-panel" aria-label="Tire details"></aside>
  </section>

  <!-- ------------------------------------------------------- dashboard -->
  <section id="view-dashboard" class="view view-scroll" hidden></section>

  <!-- ------------------------------------------------------------- log -->
  <section id="view-log" class="view view-scroll" hidden></section>

  <!-- -------------------------------------------------------- settings -->
  <section id="view-settings" class="view view-scroll" hidden></section>
</main>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/positions.js"></script>
<script src="assets/js/svgutil.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/render-topdown.js"></script>
<script src="assets/js/render-iso.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/form.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
